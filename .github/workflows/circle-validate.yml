name: Circle validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run controller and Service tests
        run: python -m unittest discover -s circle/tests -v
      - name: Validate merged Circle facts when present
        shell: bash
        run: |
          if [ -d .circle ]; then
            python circle/scripts/circle.py --project-root . validate
            python circle/scripts/circle.py --project-root . render
            git diff --exit-code -- .circle/DAG.md
          else
            echo "No root .circle store; test fixtures cover merge-result invariants."
          fi
